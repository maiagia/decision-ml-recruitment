name: Testes do Projeto

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api:${{ github.workspace }}/api_interna

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Atualizar pip e instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r api_interna/requirements.txt
        pip install -r etl/requirements.txt
        pip install pytest httpx

    - name: Rodar os testes com pytest
      run: |
        echo "PYTHONPATH=$PYTHONPATH"
        pytest tests/ --disable-warnings
