[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-recruitment"
version = "0.1.0"
authors = [
    { name = "MLET3", email = "mlet3@gmail.com" }
]
description = "Pacote para treinar e pré-processar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
